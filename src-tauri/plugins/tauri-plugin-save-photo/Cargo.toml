[package]
name = "tauri-plugin-save-photo"
version = "0.1.0"
description = "Saves an image straight into the iOS photo library"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "tauri-plugin-save-photo"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
