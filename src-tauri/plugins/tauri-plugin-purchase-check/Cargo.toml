[package]
name = "tauri-plugin-purchase-check"
version = "0.1.0"
description = "Asks StoreKit whether this iOS device may make in-app purchases"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "tauri-plugin-purchase-check"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
