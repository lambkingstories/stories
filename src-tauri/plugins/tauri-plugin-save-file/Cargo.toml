[package]
name = "tauri-plugin-save-file"
version = "0.1.0"
description = "Android: saves a file where the person chooses (the web view cannot download)"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "tauri-plugin-save-file"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
