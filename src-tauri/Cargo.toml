[package]
name = "lamb-king-stories"
version = "1.0.0"
description = "LambKing Stories — illustrated audio-bible storybook reader for kids"
authors = ["Konstantin Steinmiller"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# In-app purchases (LambKing Plus, coloring books, iOS tips): StoreKit on iOS,
# Google Play Billing on Android. Since release 1.2 (2026-11-04) Android sells
# Plus too, so the plugin (and with it the BILLING permission) is in both
# mobile builds. Desktop keeps the PayPal / Ko-fi links.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-iap = "0.9"

[target.'cfg(target_os = "ios")'.dependencies]
# Coloring page download button: WKWebView ignores <a download>, so the
# picture goes straight into Photos through this app-local plugin.
tauri-plugin-save-photo = { path = "plugins/tauri-plugin-save-photo" }
# Tip sheet: says up front when Screen Time or a work-device profile blocks
# in-app purchases (tauri-plugin-iap has no such check).
tauri-plugin-purchase-check = { path = "plugins/tauri-plugin-purchase-check" }
# Apple Pencil double tap: switches the coloring screen between the eraser and the tool before.
tauri-plugin-pencil = { path = "plugins/tauri-plugin-pencil" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
