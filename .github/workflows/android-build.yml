name: Android Build & Sign

# Builds the signed Play Store bundle (.aab) and an installable .apk.
# Upload the .aab by hand in the Play Console (Test and release -> Closed testing).
# Last build request: 2026-11-04 (release 1.2: purchases on Android through Play Billing (tauri-plugin-iap), microphone permission for family voices; second run after restoring the Mauer game files).
#
# Needs the repository secrets ANDROID_KEYSTORE_BASE64 (the release keystore,
# base64) and ANDROID_KEYSTORE_PASSWORD (store = key password; alias `lambking`).

on:
  workflow_dispatch:
  # Runs from the redesign branch, because a workflow can only be started by
  # hand once the file is on `main`. Remove this block when it is merged.
  push:
    branches: [ueberarbeitung-2026-10]
    paths: ['.github/workflows/android-build.yml']

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build signed AAB + APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # Same build variables as the local `.env.tauri` (a clean checkout has none
      # of the gitignored .env files; without the client key every API call
      # answers 401 MISSING_CLIENT_KEY). Client keys are not secrets.
      VITE_APP_NATIVE: "true"
      VITE_APP_DEMO: "false"
      VITE_NODE_ENV: production
      VITE_ENABLE_OBFUSCATION: "false"
      VITE_APP_FPS_CAP: "60"
      VITE_APP_DEBUG: "false"
      VITE_DEBUG_CONSOLE: "false"
      VITE_APP_TITLE: LambKing Stories
      # Release 1.1 (2026-11-04): exactly these adventures are public and in the app: Josef (always) + Adam und Eva, Noah, Babel, Abraham, Jakob, Mose.
      # Every adventure adds about 17 MB; Apple allows 500 MB for the executable, Google about 200 MB per download. Do not add more without measuring (vite build, du -sm dist).
      # Release 1.2 (2026-11-04): purchases on (LambKing Plus). Free: Josef, Adam und Eva, Noah, Babel, Abraham, Jakob (FREE_JOURNEYS); Mose is Plus.
      VITE_PREMIUM_TEASER: "true"
      VITE_SHOW_NOAH: "true"
      VITE_SHOW_ADAM: "true"
      VITE_SHOW_BABEL: "true"
      VITE_SHOW_ABRAHAM: "true"
      VITE_SHOW_JAKOB: "true"
      VITE_SHOW_MOSE: "true"
      VITE_CLIENT_KEY: tauri-key-public-1111
      VITE_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://lbs-be.onrender.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Play needs a strictly rising versionCode; the last one used by hand was
      # 1000020. Builds from here count up with the run number.
      - name: Compute versionCode
        run: echo "ANDROID_VERSION_CODE=$((1000100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Locate Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "::error::No Android NDK on this runner"
            exit 1
          fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK $NDK"

      # src-tauri/gen/ is not fully in Git (only the launcher icons and
      # assets are). `tauri android init` creates the Gradle project; the icons
      # that are in Git are restored afterwards, so the store icon stays ours.
      - name: Initialize Tauri Android project
        run: |
          # `init` refuses a half-filled gen/android, so set the icons aside first.
          cp -R src-tauri/gen/android/app/src/main/res "$RUNNER_TEMP/android-res"
          rm -rf src-tauri/gen/android
          pnpm exec tauri android init --ci
          cp -R "$RUNNER_TEMP/android-res/." src-tauri/gen/android/app/src/main/res/

      # Family voices (Ich -> Eltern -> Stimmen) record through the WebView's
      # getUserMedia; the Tauri WebView asks for RECORD_AUDIO only if the
      # manifest declares it, and `tauri android init` does not.
      - name: Declare microphone permission
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' "$M" || sed -i '0,/<application/s##<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"
          grep -q 'android.permission.RECORD_AUDIO' "$M" || { echo "::error::RECORD_AUDIO could not be added to $M"; exit 1; }
          grep -n 'uses-permission' "$M"

      - name: Patch Gradle (release signing + versionCode)
        run: |
          node scripts/patch-android-signing.mjs
          node scripts/patch-android-versioncode.mjs

      - name: Write signing material
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "password=$KEYSTORE_PASSWORD"
            echo "keyAlias=lambking"
            echo "storeFile=$RUNNER_TEMP/release.keystore"
          } > src-tauri/gen/android/key.properties

      - name: Build signed AAB + APK
        run: pnpm exec tauri android build --aab --apk

      - name: Verify the APK is signed
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No .apk found"
            exit 1
          fi
          case "$APK" in *unsigned*) echo "::error::APK is unsigned: $APK"; exit 1;; esac
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256"
          echo "$APK"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" src-tauri/gen/android/key.properties
