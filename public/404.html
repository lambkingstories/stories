<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>LambKing: nicht gefunden</title>
  <!--
    Wird von Cloudflare Pages (und GitHub Pages) fuer JEDE Adresse ausgeliefert, die es nicht gibt, mit dem Status 404.
    Gibt es im Projekt keine 404.html, antwortet Cloudflare Pages auf fehlende Dateien mit der Startseite und dem Status 200
    (Single-Page-App-Rueckfall); ein fehlendes Bild oder ein fehlender Ton bliebe dann unbemerkt. Die App selbst braucht den
    Rueckfall nicht: ihre Seiten stehen hinter "#" (Hash-Router), also immer unter "/".
    Diese Seite laedt absichtlich kein Skript und keine App-Datei.
  -->
  <style>
    html, body { margin: 0; min-height: 100%; background: #edf3f1; color: #2b3a3a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) { html, body { background: #162433; color: #e6eef0; } a { color: #ffd77a !important; } }
    main { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; box-sizing: border-box; }
    img { width: 96px; height: auto; }
    h1 { margin: 0; font-size: 1.4rem; }
    p { margin: 0; max-width: 28rem; line-height: 1.45; }
    a { color: #1f6fa8; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/images/logo/lk-lamm.webp" alt="" width="96" draggable="false">
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Hier ist nichts zu finden. <a href="/">Zur LambKing-App</a></p>
    <p lang="en">This page does not exist. <a href="/">Back to the LambKing app</a></p>
  </main>
</body>
</html>
